<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seville Purrfect Rescue | Cat Adoption</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/mdi/paw.svg" />
</head>
<body class="bg-light">

    <!-- navigation bar -->
    <nav class="navbar navbar-expand-lg custom-nav">
        <div class="container">
            <a class="navbar-brand nav-logo" href="#">🐾 SPR</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link nav-enlace" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-enlace" href="#footer">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="text-center py-5 custom-header">
        <h1 class="display-4 fw-bold">Seville Purrfect Rescue</h1>
        <p class="lead">Find your new feline best friend</p>
    </header>

    <main class="container my-5">
        <div class="search-wrapper mb-4">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍  Search by name...">
        </div>
        <p id="catCount" class="text-center cat-count-text">Loading cats...</p>
        <div id="catsContainer" class="row g-4">
        </div>
    </main>

    <!-- scroll to top button -->
    <button id="scrollTopBtn" onclick="scrollToTop()" title="Volver arriba">↑</button>

    <!-- footer -->
    <footer class="custom-footer text-center py-4" id="footer">
        <p class="mb-1">🐱 Seville Purrfect Rescue — Sevilla, España</p>
        <p class="mb-0">Contacto: <a href="mailto:adopcion@sevillepurrfect.com" class="footer-link">adopcion@sevillepurrfect.com</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>
</html>
